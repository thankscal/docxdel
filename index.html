<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QP R10 頁面提取工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',Arial,sans-serif;background:#0a0e1a;color:#e0e8ff;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{background:#111827;border:1px solid #1e3a5f;border-radius:16px;padding:40px;
      width:540px;box-shadow:0 0 40px rgba(0,120,255,.12)}
h1{text-align:center;font-size:20px;color:#4fc3f7;letter-spacing:1px;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:#607d9e;margin-bottom:20px;line-height:1.6}
.pages-list{background:#0d1627;border:1px solid #1e3a5f;border-radius:10px;
            padding:14px 18px;margin-bottom:20px}
.pages-list p{font-size:12px;color:#607d9e;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.page-item{display:flex;align-items:center;gap:10px;padding:5px 0;
           border-bottom:1px solid #1a2d4a;font-size:13px;color:#90a4be}
.page-item:last-child{border-bottom:none}
.page-num{background:#1e3a5f;color:#81d4fa;border-radius:6px;padding:2px 8px;
          font-size:12px;font-weight:600;min-width:50px;text-align:center}
.info-box{background:#0d1f2d;border:1px solid #1e4a5f;border-radius:8px;
          padding:12px 16px;margin-bottom:20px;font-size:13px;color:#78a8be;line-height:1.8}
.info-box b{color:#4fc3f7}
.drop{border:2px dashed #1e3a5f;border-radius:12px;padding:36px 20px;
      text-align:center;cursor:pointer;transition:.2s;background:#0d1627;position:relative}
.drop:hover,.drop.over{border-color:#4fc3f7;background:#111f35}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.icon{font-size:38px;margin-bottom:10px}
.dtxt{font-size:15px;color:#90a4be}
.dhint{font-size:12px;color:#4a637d;margin-top:5px}
.fname{margin-top:12px;padding:9px 14px;background:#0d1f35;border:1px solid #1e3a5f;
       border-radius:8px;font-size:13px;color:#4fc3f7;display:none;word-break:break-all}
.btn{width:100%;margin-top:16px;padding:14px;
     background:linear-gradient(135deg,#1565c0,#0288d1);color:#fff;
     border:none;border-radius:10px;font-size:16px;font-weight:600;
     cursor:pointer;transition:opacity .2s;letter-spacing:.5px}
.btn:hover{opacity:.9}.btn:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:14px;padding:11px 14px;border-radius:8px;font-size:14px;display:none;line-height:1.6}
.proc{background:#1a2d4a;border:1px solid #2d6a9f;color:#81d4fa;display:block}
.ok  {background:#0d2d1a;border:1px solid #1b5e20;color:#81c784;display:block}
.err {background:#2d1010;border:1px solid #7f1919;color:#ef9a9a;display:block}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #4fc3f7;
      border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;
      margin-right:7px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈ QP06M8003F8-R10 提取工具</h1>
  <p class="sub">從原始 R10 .docx 提取指定頁面<br>版型、字型、表格完全還原</p>
  <div class="pages-list">
    <p>📋 提取頁面</p>
    <div class="page-item"><span class="page-num">頁 1</span> 封面（Mechanic Log Book / 工作經歷簿）</div>
    <div class="page-item"><span class="page-num">頁 10</span> 個人資訊（Trainee Data / 執照 / 聘僱資訊）</div>
    <div class="page-item"><span class="page-num">頁 14</span> 工作經歷紀錄表格（第5節）</div>
  </div>
  <div class="info-box">
    <b>使用說明：</b><br>
    1. 用 Word 開啟 <b>QP06M8003F8-R10.doc</b><br>
    2. 另存為 <b>.docx</b> 格式（Ctrl+Shift+S）<br>
    3. 上傳 .docx → 自動下載精簡版
  </div>
  <div class="drop" id="dz">
    <input type="file" id="fi" accept=".docx">
    <div class="icon">📄</div>
    <div class="dtxt">點擊選擇或拖放 .docx</div>
    <div class="dhint">僅支援 QP06M8003F8-R10 格式</div>
  </div>
  <div class="fname" id="fn"></div>
  <button class="btn" id="btn" disabled>開始提取</button>
  <div class="status" id="st"></div>
</div>

<script>
const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

function elems(node){
  return Array.from(node.childNodes).filter(n => n.nodeType === 1);
}
function getText(node){
  return Array.from(node.getElementsByTagNameNS(NS,'t'))
              .map(t => t.textContent||'').join('').trim();
}
function hasPB(node){
  return Array.from(node.getElementsByTagNameNS(NS,'br'))
              .some(b => (b.getAttributeNS(NS,'type')||b.getAttribute('w:type')||'') === 'page');
}
function hasSectPr(node){
  const pPr = node.getElementsByTagNameNS(NS,'pPr')[0];
  return !!(pPr && pPr.getElementsByTagNameNS(NS,'sectPr').length);
}

async function processDocx(buf){
  const zip = await JSZip.loadAsync(buf);
  if(!zip.file('word/document.xml'))
    throw new Error('不是有效的 .docx（找不到 word/document.xml）');

  const docStr = await zip.file('word/document.xml').async('string');
  const docXml = new DOMParser().parseFromString(docStr,'application/xml');
  if(docXml.querySelector('parsererror'))
    throw new Error('XML 解析失敗，檔案可能損壞');

  const body = docXml.getElementsByTagNameNS(NS,'body')[0];
  if(!body) throw new Error('找不到 body 元素');

  const ch = elems(body);
  const n  = ch.length;
  console.log('body children:', n);

  // ── 1. 封面：從頭到「姓名」段落之前 ──
  let coverEnd = -1;
  for(let i=0; i<Math.min(30,n); i++){
    const t = getText(ch[i]);
    if(t.includes('姓名') || (t.includes('Name') && t.includes('ID'))){
      coverEnd = i; break;
    }
  }
  if(coverEnd === -1) throw new Error('找不到封面結束點（姓名欄），請確認是正確的 R10 檔案');

  // ── 2. 個人資訊：找含「Trainee Data」且有「Surname」的表格，往前取標題段落 ──
  let traineeTableIdx = -1;
  for(let i=0; i<n; i++){
    if(ch[i].localName !== 'tbl') continue;
    const t = getText(ch[i]);
    // 真正的空白表格特徵：含 Trainee Data 且含 Surname（非說明表格）
    if(t.includes('Trainee Data') && t.includes('Surname') && !t.includes('填上中文姓')){
      traineeTableIdx = i; break;
    }
  }
  if(traineeTableIdx === -1) throw new Error('找不到個人資訊表格（Trainee Data），請確認是正確的 R10 檔案');

  // 往前找段落標題（「個人資訊」字樣）
  let personnelStart = traineeTableIdx;
  for(let i=traineeTableIdx-1; i>=Math.max(0,traineeTableIdx-5); i--){
    const t = getText(ch[i]);
    if(t.includes('個人資訊') || t.includes('Personnel Data')){
      personnelStart = i; break;
    }
  }

  // 往後找結束點（下一個 pageBreak 段落，不含在內）
  let personnelEnd = n-1;
  for(let i=traineeTableIdx+1; i<n; i++){
    if(hasPB(ch[i]) || hasSectPr(ch[i])){
      personnelEnd = i; break;
    }
  }
  console.log('個人資訊:', personnelStart, '~', personnelEnd);

  // ── 3. 工作經歷：找含「1. Date」「Location」「A/C」的表格，且前面有「工作經歷紀錄」 ──
  let workTableIdx = -1;
  for(let i=n-1; i>=0; i--){   // 從後往前找，避免找到說明表格
    if(ch[i].localName !== 'tbl') continue;
    const t = getText(ch[i]);
    if((t.includes('Date') && t.includes('Location') && t.includes('A/C'))
       && !t.includes('填寫說明') && !t.includes('Description')){
      workTableIdx = i; break;
    }
  }
  if(workTableIdx === -1) throw new Error('找不到工作經歷表格，請確認是正確的 R10 檔案');

  // 往前找「工作經歷紀錄」標題
  let workStart = workTableIdx;
  for(let i=workTableIdx-1; i>=Math.max(0,workTableIdx-5); i--){
    const t = getText(ch[i]);
    if(t.includes('工作經歷紀錄') || t.includes('Maintenance Experience')){
      workStart = i; break;
    }
  }

  // 往後找結束（sectPr 或文件末尾）
  let workEnd = n-1;
  for(let i=workTableIdx+1; i<n; i++){
    if(ch[i].localName === 'sectPr'){ workEnd = i; break; }
  }
  console.log('工作經歷:', workStart, '~', workEnd);

  // ── 組合 ──
  const globalSectPr = body.getElementsByTagNameNS(NS,'sectPr')[0];

  function makeSectBreak(){
    const p   = docXml.createElementNS(NS,'w:p');
    const pPr = docXml.createElementNS(NS,'w:pPr');
    pPr.appendChild(globalSectPr.cloneNode(true));
    p.appendChild(pPr);
    return p;
  }

  const RANGES = [
    [0, coverEnd],
    [personnelStart, personnelEnd],
    [workStart, workEnd],
  ];
  console.log('最終範圍:', RANGES.map(r=>`[${r[0]}:${r[1]}]`).join(' '));

  while(body.firstChild) body.removeChild(body.firstChild);
  RANGES.forEach(([s,e], idx) => {
    for(let i=s; i<e; i++) body.appendChild(ch[i].cloneNode(true));
    if(idx < RANGES.length-1) body.appendChild(makeSectBreak());
  });
  body.appendChild(globalSectPr.cloneNode(true));

  zip.file('word/document.xml', new XMLSerializer().serializeToString(docXml));

  return await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    compression:'DEFLATE', compressionOptions:{level:6}
  });
}

// ── UI ──
const fi=document.getElementById('fi'), fn=document.getElementById('fn'),
      btn=document.getElementById('btn'), st=document.getElementById('st'),
      dz=document.getElementById('dz');

function setFile(f){
  fn.textContent='📎 '+f.name; fn.style.display='block';
  btn.disabled=false; st.style.display='none';
}
fi.addEventListener('change',()=>{ if(fi.files[0]) setFile(fi.files[0]); });
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('over');
  const f=e.dataTransfer.files[0];
  if(f){ try{const dt=new DataTransfer();dt.items.add(f);fi.files=dt.files;}catch(_){}  setFile(f); }
});

btn.addEventListener('click', async ()=>{
  const file=fi.files[0]; if(!file) return;
  btn.disabled=true;
  st.className='status proc';
  st.innerHTML='<span class="spin"></span>分析文件結構，提取頁面中...';
  try{
    const buf  = await file.arrayBuffer();
    const blob = await processDocx(buf);
    const name = file.name.replace(/\.docx$/i,'')+'_extracted.docx';
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    st.className='status ok';
    st.innerHTML=`✅ 完成！<b>${name}</b> 已下載<br>
      <small style="opacity:.8;display:block;margin-top:4px">封面、個人資訊、工作經歷表格</small>`;
  }catch(e){
    console.error(e);
    st.className='status err';
    st.innerHTML='❌ '+( e.message||'未知錯誤')+
      '<br><small style="opacity:.7">按 F12 → Console 可查看詳細錯誤</small>';
  }finally{ btn.disabled=false; }
});
</script>
</body>
</html>
