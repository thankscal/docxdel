<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>華航工作經歷簿｜精簡工具（加強版型）</title>
    <style>
        body { background: #eef2f7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 30px 20px; display: flex; justify-content: center; }
        .card { max-width: 1000px; background: white; border-radius: 28px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: #003366; padding: 20px 28px; color: white; }
        .content { padding: 28px 30px 35px; }
        .step-box { background: #eef3fc; border-radius: 20px; padding: 20px; margin-bottom: 25px; border-left: 6px solid #0066b3; }
        .upload-area { border: 2px dashed #b0c4de; border-radius: 24px; background: #f8fafd; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .btn { background: #0066b3; color: white; border: none; padding: 10px 26px; border-radius: 40px; cursor: pointer; font-size: 1rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 10px; border-radius: 14px; background: #f0f4fa; }
        .loader { display: inline-block; width: 18px; height: 18px; border: 2px solid #ccc; border-top-color: #0066b3; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .note { background: #fff8e7; padding: 12px 18px; margin-top: 20px; border-radius: 14px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>✈ 華航工作經歷簿 · 精簡工具（加強版型）</h1>
        <p>保留 封面 + 個人資訊 + 工作經歷｜每個區塊獨立一頁｜自動刪除其餘章節</p>
    </div>
    <div class="content">
        <div class="step-box">
            <div class="step-title">📤 上傳 .docx 檔案</div>
            <div id="dropzone" class="upload-area">
                <div style="font-size: 40px;">📄</div>
                <div>點擊或拖曳上傳 <strong>.docx</strong> 檔案</div>
                <input type="file" id="fileInput" accept=".docx" style="display:none;">
            </div>
            <div style="text-align: right;">
                <button id="processBtn" class="btn" disabled>▶ 開始精簡並下載</button>
            </div>
        </div>
        <div id="statusMessage" class="status"></div>
        <div class="note">
            💡 若下載後版型仍不滿意，建議使用 Word 手動刪除章節（方法如上），僅需 1 分鐘且完全不跑版。
        </div>
    </div>
</div>

<script>
    (function() {
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('statusMessage');
        let uploadedFile = null, processing = false;

        function setStatus(msg, isError = false, isLoading = false) {
            statusDiv.innerHTML = '';
            if (isLoading) statusDiv.innerHTML = '<span class="loader"></span> ' + msg;
            else statusDiv.innerHTML = (isError ? '⚠️ ' : '✅ ') + msg;
            statusDiv.style.color = isError ? '#b33' : '#1e6b3b';
        }

        function updateBtn() { processBtn.disabled = !uploadedFile || processing; }

        async function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.docx')) {
                setStatus('❌ 僅接受 .docx 格式', true);
                uploadedFile = null; updateBtn(); return;
            }
            uploadedFile = file;
            setStatus(`✔ 已選取：${file.name}`);
            updateBtn();
        }

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', e => e.preventDefault());
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

        function extractSections(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const body = doc.body;
            const all = Array.from(body.children);
            const clone = n => n.cloneNode(true);
            const container = doc.createElement('div');

            // 分頁元件
            const pageBreak = () => {
                const div = doc.createElement('div');
                div.style.pageBreakBefore = 'always';
                div.style.height = '0';
                div.style.margin = '0';
                div.innerHTML = '&nbsp;';
                return div;
            };

            // 1. 封面 (到「個人資訊」之前)
            let cover = [];
            for (let el of all) {
                if ((el.innerText || '').toLowerCase().includes('個人資訊')) break;
                cover.push(el);
            }
            if (!cover.length && all.length) cover = all.slice(0, 5);
            cover.forEach(el => container.appendChild(clone(el)));
            container.appendChild(pageBreak());

            // 2. 個人資訊 (到「工作經歷紀錄」之前)
            let personal = [];
            let inPersonal = false;
            for (let el of all) {
                let txt = el.innerText || '';
                if (!inPersonal && (txt.includes('個人資訊') || txt.includes('Personnel Data'))) inPersonal = true;
                if (inPersonal) {
                    if (txt.toLowerCase().includes('工作經歷紀錄') || txt.toLowerCase().includes('maintenance experience')) break;
                    personal.push(el);
                }
            }
            if (personal.length) personal.forEach(el => container.appendChild(clone(el)));
            else container.appendChild(doc.createElement('p')).innerText = '⚠️ 未偵測到個人資訊';
            container.appendChild(pageBreak());

            // 3. 工作經歷紀錄 (到結尾)
            let work = [];
            let inWork = false;
            for (let el of all) {
                let txt = el.innerText || '';
                if (!inWork && (txt.includes('工作經歷紀錄') || txt.includes('Maintenance Experience'))) inWork = true;
                if (inWork) work.push(el);
            }
            if (work.length) work.forEach(el => container.appendChild(clone(el)));
            else container.appendChild(doc.createElement('p')).innerText = '⚠️ 未偵測到工作經歷紀錄';

            // 補簽名 (若無)
            let hasSig = false;
            for (let el of work) if ((el.innerText || '').includes('Name:') && (el.innerText || '').includes('Signature')) hasSig = true;
            if (!hasSig) {
                const sig = doc.createElement('div');
                sig.innerHTML = `<div style="margin-top: 30px;"><table style="width:100%; border:none;"><tr>
                    <td style="border:none;"><strong>Name:</strong> _________________</td>
                    <td style="border:none;"><strong>Signature:</strong> _________________</td>
                    <td style="border:none;"><strong>ID No.:</strong> ___________</td>
                    <td style="border:none;"><strong>License / No.:</strong> ___________</td>
                </tr></table></div>`;
                container.appendChild(sig);
            }

            return `<!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8">
            <style>
                @page { margin: 2.54cm; }
                body { margin: 0; padding: 0; font-family: 'Calibri', 'Times New Roman', serif; line-height: 1.3; background: white; }
                img { max-width: 100%; height: auto; }
                table { border-collapse: collapse; width: 100%; margin: 10pt 0; font-size: 11pt; }
                td, th { border: 1px solid #7f7f7f; padding: 6pt 8pt; vertical-align: top; }
                .MsoNormal, p, h1, h2, h3 { margin: 0 0 6pt; }
            </style>
            </head>
            <body>${container.innerHTML}</body>
            </html>`;
        }

        async function process() {
            if (!uploadedFile || processing) return;
            if (typeof mammoth === 'undefined' || typeof saveAs === 'undefined' || typeof htmlDocx === 'undefined') {
                setStatus('❌ 函式庫載入失敗，請檢查網路後重新整理頁面', true);
                return;
            }
            processing = true; updateBtn();
            setStatus('🔄 處理中，請稍候...', false, true);
            try {
                const ab = await uploadedFile.arrayBuffer();
                const result = await mammoth.convertToHtml({ arrayBuffer: ab, convertImage: mammoth.images.imgElement(async img => {
                    const b64 = await img.read('base64');
                    return { src: `data:${img.contentType};base64,${b64}`, alt: img.altText || '' };
                })});
                const finalHtml = extractSections(result.value);
                const blob = htmlDocx.asBlob(finalHtml, { orientation: 'portrait', margins: { top: 1440, right: 1440, bottom: 1440, left: 1440 } });
                const outName = uploadedFile.name.replace(/\.docx$/i, '') + '_精簡版.docx';
                saveAs(blob, outName);
                setStatus(`✨ 完成！已下載 ${outName}`);
            } catch (err) {
                console.error(err);
                setStatus(`❌ 失敗：${err.message || '請確認檔案為標準 DOCX'}`, true);
            } finally {
                processing = false; updateBtn();
            }
        }
        processBtn.addEventListener('click', process);
        updateBtn();
    })();
</script>
</body>
</html>
